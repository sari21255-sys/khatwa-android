function reportData(n){
 const w0=wkStart(Date.now()),wi=ts=>Math.round((w0-wkStart(ts))/(7*DAY));
 const inW=ts=>wi(ts)>=0&&wi(ts)<n;
 const ss=S.sessions.filter(s=>s.status==='complete'&&inW(s.ts)),ms=S.meals.filter(m=>inW(m.ts)),ws=S.weights.filter(x=>inW(x.ts));
 const tr=Math.min(100,Math.round(ss.length/(plan().d*n)*100));
 let nuSum=0;for(let i=0;i<n;i++){const days={};ms.filter(m=>wi(m.ts)===i).forEach(m=>{const d=dkey(m.ts);const o=days[d]=days[d]||{k:0,p:0};o.k+=m.kcal;o.p+=m.p});const ds=Object.values(days),lg=ds.length;if(lg){const ko=ds.filter(d=>Math.abs(d.k-TG.kcal)<=TG.kcal*.1).length,po=ds.filter(d=>d.p>=TG.p*.9).length;nuSum+=Math.round(lg/7*40+ko/lg*30+po/lg*30)}}
 const nu=Math.round(nuSum/n);
 let coSum=0;for(let i=0;i<n;i++){const d=new Set([...ss.filter(s=>wi(s.ts)===i).map(s=>dkey(s.ts)),...S.visits.filter(t=>wi(t)===i).map(dkey)]);coSum+=Math.min(100,Math.round(d.size/plan().d*100))}
 const co=Math.round(coSum/n),sl=S.sleep?Math.min(100,Math.round(S.sleep/8*100)):0;
 let pr=0;if(ws.length>=2){const f=ws[0].kg,l=ws[ws.length-1].kg,wk=(l-f)/Math.max(1,n),dir=S.target<f?-1:1;pr=Math.max(0,Math.min(100,Math.round(50+(wk*dir)/0.5*50)))}
 return {tr,nu,co,sl,pr,score:Math.round(tr*.35+nu*.25+co*.2+sl*.1+pr*.1),has:!!(ss.length||ms.length||ws.length)};
}

function startSession(){
 let s=todaysSession();
 if(s&&s.status==='complete'){toast('أنجزت تمرين اليوم. تجده في الأرشيف');return}
 if(!s){
  const d=today();
  s={id:'s'+Date.now(),t:d.t,ts:Date.now(),status:'new',ei:0,exs:d.ex.map(e=>({n:e.n,m:e.m,u:e.u,sets:Array.from({length:e.s},()=>({r:e.r,w:e.w==null?0:e.w,done:false}))}))};
  S.sessions.push(s);
 }
 S.cur=s.id;S.screen='workout';S.stack=[];save();render();
}
const curS=()=>S.sessions.find(s=>s.id===S.cur);
function nextSet(s){for(let i=0;i<s.exs.length;i++){const j=s.exs[i].sets.findIndex(x=>!x.done);if(j>=0)return [i,j]}return null}
function tickRest(){
 const el=$('#restt');if(!rest){clearInterval(restT);restT=null;return}
 const left=Math.ceil((rest.end-Date.now())/1000);
 if(left<=0){rest=null;clearInterval(restT);restT=null;render();return}
 if(el)el.textContent=mmss(left);
}
function doneSet(){
 const s=curS();if(!s)return;const n=nextSet(s);if(!n)return;
 const e=s.exs[n[0]],x=e.sets[n[1]];x.done=true;
 s.status=nextSet(s)?'partial':'complete';s.ei=n[0];
 if(s.status==='complete'){S.cur=s.id;S.screen='summary';rest=null;toast('تم حفظ الجلسة كاملة')}
 else{const fin=e.sets.every(y=>y.done);rest={end:Date.now()+(fin?60:90)*1000,e:n[0],j:n[1]};clearInterval(restT);restT=setInterval(tickRest,500);toast('حُفظت المجموعة')}
 save();render();
}

/* ===== التقدم ===== */
function wChart(arr,h){
 if(arr.length<2)return '';
 const W=320,H=h||110,p=14,xs=arr.map((_,i)=>p+i*(W-2*p)/(arr.length-1));
 const v=arr.map(a=>a.kg),lo=Math.min(...v,S.target)-1,hi=Math.max(...v)+1;
 const y=k=>H-p-(k-lo)/(hi-lo)*(H-2*p);
 const pts=arr.map((a,i)=>xs[i].toFixed(1)+','+y(a.kg).toFixed(1)).join(' ');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم الوزن"><line x1="${p}" x2="${W-p}" y1="${y(S.target)}" y2="${y(S.target)}" stroke="var(--c-done)" stroke-dasharray="4 4"/><text x="${W-p}" y="${y(S.target)-4}" text-anchor="end">الهدف ${S.target}</text><polyline points="${pts}" fill="none" stroke="var(--c-prog)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${arr.map((a,i)=>`<circle cx="${xs[i]}" cy="${y(a.kg)}" r="3" fill="var(--c-prog)"/>`).join('')}</svg>`;
}

 }
 else if(k==='visits'){
  h+=`<button class="btn" data-a="visit">وصلت الآن</button><div class="lab">آخر الزيارات</div>${S.visits.length?`<div class="card lst">${S.visits.slice().reverse().slice(0,10).map(t=>`<div><span class="g"><b>${dlabel(t)}</b></span></div>`).join('')}</div>`:`<div class="empty"><p>لا زيارات مسجّلة.</p></div>`}`;
 }
 else if(k==='sleep'){
  h+=`<button class="btn" data-a="sheet" data-v="sleep">سجّل نوم الليلة</button>${S.sleep?`<div class="card"><div class="bigno">${S.sleep} <small>ساعات</small></div><p class="mu">الهدف 8 ساعات</p></div>`:`<div class="empty"><p>لم تسجّل نومك.</p></div>`}`;
 }
 else if(k==='plan'){
  h+=dayList().map(d=>`<div class="lab">${DAYN[d.day]} · ${d.t}</div><div class="card lst">${d.ex.map(e=>`<div><span class="g"><b>${e.n}</b><span>${e.s}×${e.r}${e.u||''}${e.w?' · '+e.w+' كغ':''}</span></span></div>`).join('')}</div>`).join('');
 }
 else if(k==='missed'){
  const p=S.sessions.filter(s=>s.status==='partial').slice().reverse();
  h+=p.length?`<div class="lab">جلسات جزئية</div><div class="card lst">${p.map(s=>`<button data-a="detail" data-v="${s.id}"><span class="g"><b>${s.t}</b><span>${dshort(s.ts)} · ${setsOf(s)} من ${totOf(s)}</span></span>${IC.chev()}</button>`).join('')}</div>`:`<div class="empty"><p>لا شيء متأخر.</p></div>`;
 }
 if(k==='privacy'){
  h+=`<div class="card"><b>ما يُحفظ على جوالك</b><ul class="bul mu" style="margin-top:8px"><li>الجلسات والأوزان والوجبات والأهداف</li><li>لا يُرسل شيء خارج جوالك في هذه النسخة</li></ul></div>`;
 }
 /* المعلومات العامة */
 h+=`<div class="lab">من أين تصل إليها</div><div class="card"><p>${WHERE[k]||'المزيد'}</p></div>`;
 h+=`<div class="lab">ما تحتويه</div><div class="card"><ul class="bul">${v.has.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 h+=`<div class="lab">التحسين المقترح</div><div class="card"><ul class="bul">${v.imp.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 if(v.need)h+=`<div class="lab">ما يلزم لتفعيلها</div><div class="card"><ul class="bul">${v.need.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 return h;
}
function vSvc(k){const v=SV[k];return `<div class="pad t">${hdr(v.t,v.sub)}<div style="margin-bottom:12px">${pill(v.st)}</div>${svcBody(k)}</div>`}
function vDetail(id){
 const s=S.sessions.find(x=>x.id===id);if(!s)return `<div class="pad">${hdr('الجلسة')}</div>`;
 return `<div class="pad t">${hdr(s.t,dlabel(s.ts))}<div class="rowx" style="margin-bottom:12px">${s.status==='partial'?`<span class="partial-tag">${IC.clock()} جزئي · ${setsOf(s)} من ${totOf(s)} مجموعة</span>`:`<span class="pill live">مكتمل</span>`}</div>
 ${s.status==='partial'?`<button class="btn" data-a="resume" data-v="${s.id}" style="margin-bottom:14px">أكمل التمرين</button>`:''}
 ${s.exs.map(e=>`<div class="lab">${e.n}</div><div class="card lst">${e.sets.map((x,i)=>`<div><span class="g"><b>المجموعة ${i+1}</b><span>${x.done?x.r+(e.u||' تكرار')+(x.w?' × '+x.w+' كغ':'')+(x.rpe?' · RPE '+x.rpe:''):'لم تُسجَّل'}</span></span>${x.done?IC.check('var(--c-done)'):''}</div>`).join('')}</div>`).join('')}</div>`;
}

/* ===== المشغّل والملخص ===== */
function vWorkout(){
 const s=curS();if(!s)return '';
 const n=nextSet(s);if(!n)return '';
 const e=s.exs[n[0]],x=e.sets[n[1]],a=setsOf(s),b=totOf(s),lo=lastOf(e.n);
 return `<div class="pad wk"><div class="hd"><button class="ib" data-a="leave" aria-label="حفظ والخروج">${IC.x()}</button><div class="grow"><div class="sub2">${s.t} · ${a} من ${b}</div></div><button class="lnk sm" data-a="fin">إنهاء</button></div>
 <div class="prog" style="margin-bottom:14px"><i style="width:${Math.round(a/b*100)}%"></i></div>
 <h1>${e.n}</h1><p class="mu">${e.m} · المجموعة ${n[1]+1} من ${e.sets.length}</p>
 ${lo?`<p class="hint2">آخر مرة: ${lo.r}${lo.w?' × '+lo.w+' كغ':''}</p>`:''}
 <div class="stp2"><span>${e.u==='ث'?'الثواني':'التكرار'}</span><button class="ib" data-a="adj" data-v="r:-1" aria-label="أنقص">−</button><b>${x.r}</b><button class="ib" data-a="adj" data-v="r:1" aria-label="زِد">+</button></div>
 ${e.sets[0].w||x.w||e.m!=='البطن'?`<div class="stp2"><span>الوزن (كغ)</span><button class="ib" data-a="adj" data-v="w:-2.5" aria-label="أنقص">−</button><b>${fmt(x.w)}</b><button class="ib" data-a="adj" data-v="w:2.5" aria-label="زِد">+</button></div>`:''}
 <div class="card lst" style="margin-top:12px">${e.sets.map((y,i)=>`<div class="srow ${y.done?'done':i===n[1]?'act':''}"><span class="g"><b>${i+1}</b></span><span class="r">${y.done?y.r+(y.w?' × '+y.w:''):'—'}</span>${y.done?IC.check('var(--c-done)'):''}</div>`).join('')}</div>
 <button class="btn" data-a="done" style="margin-top:14px">تمّت المجموعة</button>
 ${rest?`<div class="lab" style="margin:12px 0 6px">الجهد RPE للمجموعة الأخيرة (اختياري)</div><div class="opt2">${[7,8,9,10].map(v=>`<button class="${s.exs[rest.e].sets[rest.j].rpe===v?'on':''}" data-a="rpe" data-v="${v}">${v}</button>`).join('')}</div>`:''}
 ${rest?`<div class="rbar"><span>${IC.timer()} راحة <b id="restt">${mmss((rest.end-Date.now())/1000)}</b></span><button class="lnk sm" data-a="undo">تراجع</button><button class="lnk sm" data-a="skiprest">تخطَّ</button></div>`:''}
 </div>`;
}
function vSummary(){
 const s=curS()||latest();if(!s)return '';
 return `<div class="pad ctr"><div class="logo done">${IC.check('var(--btn-ink)')}</div><h1>أحسنت</h1><p class="mu">${s.t}: ${setsOf(s)} مجموعة، حجم ${Math.round(volOf(s))} كغ.</p><div class="card" style="width:100%"><b>هدف الأسبوع</b><p class="mu">${weekDone()} من ${plan().d} تمارين</p></div><button class="btn" data-a="home">العودة إلى اليوم</button><button class="lnk" data-a="svc" data-v="archive">افتح الجلسة في الأرشيف</button></div>`;
}

/* ===== النوافذ السفلية ===== */
function vSheet(){
 if(!sheet)return '';
 let t='',b='',ic='';
 if(sheet.k==='weight'){
  t='سجّل وزنك';ic=IC.scale('var(--c-prog)');
  b=`<div class="fld2"><span>الوزن (كغ)</span><input class="in" id="sw" inputmode="decimal" value="${lastKg()||''}" placeholder="مثال 77.5"></div><div class="fld2"><span>ملاحظة (اختياري)</span><input class="in" id="sn"></div><button class="btn" data-a="savew">احفظ</button>`;
 }else if(sheet.k==='meal'){
  t='سجّل وجبة';ic=IC.food('var(--c-done)');
  const q=(sheet.q||'').trim(),r=FOODS.filter(f=>!q||f[0].includes(q));
  b=`<div class="opt2" style="margin-bottom:10px">${MEALN.map(m=>`<button class="${(sheet.type||'فطور')===m?'on':''}" data-a="mtype" data-v="${m}">${m}</button>`).join('')}</div><input class="in" id="fq" placeholder="ابحث عن طعام" value="${esc(sheet.q||'')}" style="margin-bottom:10px" aria-label="ابحث عن طعام"><div class="res" style="max-height:34vh;overflow:auto">${r.map(f=>{const i=FOODS.indexOf(f);return `<button class="${sheet.sel===i?'on':''}" data-a="fsel" data-v="${i}"><span><b>${f[0]}</b><small>${f[1]} · ${f[3]} غ بروتين</small></span><span>${f[2]}</span></button>`}).join('')||'<p class="mu">لا نتائج</p>'}</div><button class="btn" data-a="savem" ${sheet.sel==null?'disabled':''}>أضف الوجبة</button>`;
 }else if(sheet.k==='water'){
  t='ماء اليوم';ic=IC.drop('var(--c-rest)');
  b=`<div class="bigno">${S.water} <small>مل من ${TG.water}</small></div><div class="opt2"><button data-a="water" data-v="250">+250</button><button data-a="water" data-v="500">+500</button><button data-a="water" data-v="-250">−250</button></div>`;
 }else if(sheet.k==='sleep'){
  t='نوم الليلة';ic=IC.moon('var(--c-prog)');
  b=`<div class="stp2"><span>الساعات</span><button class="ib" data-a="sl" data-v="-0.5" aria-label="أنقص">−</button><b>${S.sleep||7}</b><button class="ib" data-a="sl" data-v="0.5" aria-label="زِد">+</button></div><button class="btn" data-a="savesl">احفظ</button>`;
 }else if(sheet.k==='finish'){
  const s=curS();t='إنهاء التمرين';ic=IC.check();
  b=`<p class="mu">سجّلت ${setsOf(s)} من ${totOf(s)} مجموعة.</p><button class="btn" data-a="keep">${setsOf(s)?'احفظ جزئيًا وأكمل لاحقًا':'اخرج دون حفظ'}</button><button class="btn ghost" data-a="closesh" style="margin-top:8px">أكمل الآن</button>`;
 }
 return `<div class="sheet-bg" data-a="closesh"><div class="sheet" data-a="noop" role="dialog" aria-label="${t}" data-sheet="${sheet.k}"><div class="rowx sh-title"><span class="ib">${ic}</span><h2 class="grow">${t}</h2><button class="ib" data-a="closesh" aria-label="إغلاق">${IC.x()}</button></div>${b}</div></div>`;
}

/* ===== التبويبات والعرض ===== */
const TABS=[['home','اليوم','today'],['train','التمرين','dumb'],['food','التغذية','food'],['prog','التقدّم','chart'],['more','المزيد','grid']];
function render(){
 const app=$('#app');let h='';
 const o=ov();
 if(['welcome','goal','setup','plans'].includes(S.screen))h=({welcome:vWelcome,goal:vGoal,setup:vSetup,plans:vPlans})[S.screen]();
 else if(S.screen==='workout')h=vWorkout();
 else if(S.screen==='summary')h=vSummary();
 else if(o){h=o.k==='svc'?vSvc(o.id):vDetail(o.id)}
 else{
  const v=({home:vHome,train:vTrain,food:vFood,prog:vProg,more:vMore})[S.tab]();
  h=(S.hint?`<div class="ann"><span>${NOTE[S.tab]}</span><button data-a="hint">إخفاء</button></div>`:'')+v;
 }
 const nav=(['home'].includes(S.screen)&&!o)?`<nav class="nav" aria-label="التنقل"><div>${TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}" ${S.tab===t[0]?'aria-current="page"':''}>${IC[t[2]]()}<span>${t[1]}</span></button>`).join('')}</div></nav>`:'';
 app.innerHTML=`<div class="scr">${h}</div>${nav}${vSheet()}<div id="toast" class="toast" role="status"><div></div></div>`;
 if(lastMsg&&!sheet){}
 if(S.screen==='workout'&&rest&&!restT)restT=setInterval(tickRest,500);
 wire();
}
function calcBmi(){const w=parseFloat($('#tw').value),h=parseFloat($('#th').value)/100;const r=$('#tres');if(!w||!h){r.textContent='';return}const b=w/(h*h);r.innerHTML=fmt(b)+' <small>'+(b<18.5?'نحافة':b<25?'ضمن الطبيعي':b<30?'زيادة وزن':'سمنة')+'</small>'}
function wire(){
 const aq=$('#aq');if(aq)aq.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;save();render();const n=$('#aq');n.focus();n.setSelectionRange(p,p)};
 const fq=$('#fq');if(fq)fq.oninput=e=>{sheet.q=e.target.value;sheet.sel=null;const p=e.target.selectionStart;render();const n=$('#fq');n.focus();n.setSelectionRange(p,p)};
 if($('#tw')){$('#tw').oninput=calcBmi;$('#th').oninput=calcBmi;calcBmi()}
}
/* ===== الأوامر ===== */
function act(a,v){
 switch(a){
  case 'to':S.screen=v;break;
  case 'skip':seed();S.screen='home';S.tab='home';break;
  case 'goal':S.goal=v;S.screen='setup';break;
  case 'place':S.place=v;break;
  case 'days':S.days=+v;S.planId=null;break;
  case 'plan':S.planId=v;break;
  case 'startplan':S.planId=S.planId||{3:'fb3',4:'ul4',5:'ppl5'}[S.days];S.screen='home';S.tab='home';break;
  case 'tab':S.tab=v;S.stack=[];break;
  case 'svc':sheet=null;S.stack.push({k:'svc',id:v});break;
  case 'detail':S.stack.push({k:'detail',id:v});break;
  case 'back':S.stack.pop();break;
  case 'hint':S.hint=false;break;
  case 'start':S.stack=[];sheet=null;startSession();return;
  case 'resume':{const s=S.sessions.find(x=>x.id===v);if(s){S.cur=s.id;S.screen='workout';S.stack=[]}break}
  case 'done':doneSet();return;
  case 'undo':undoSet();return;
  case 'skiprest':rest=null;break;
  case 'adj':{const p=v.split(':');adj(p[0],+p[1]);return}
  case 'leave':leaveWorkout();return;
  case 'fin':finishEarly();return;
  case 'keep':sheet=null;leaveWorkout();return;
  case 'closesh':sheet=null;break;
  case 'home':S.screen='home';S.tab='home';S.cur=null;break;
  case 'sheet':sheet={k:v};break;
  case 'savew':{const x=parseFloat(($('#sw').value||'').replace(',','.'));if(!x||x<20||x>400){toast('أدخل وزنًا صحيحًا');return}S.weights.push({ts:Date.now(),kg:x,note:$('#sn').value});sheet=null;save();render();toast('حُفظ الوزن: '+fmt(x)+' كغ');return}
  case 'mtype':sheet.type=v;break;
  case 'fsel':sheet.sel=+v;break;
  case 'savem':{const f=FOODS[sheet.sel];S.meals.push({id:'m'+Date.now(),ts:Date.now(),n:f[0],type:sheet.type||'فطور',kcal:f[2],p:f[3],c:f[4],f:f[5]});sheet=null;save();render();toast('أُضيفت الوجبة');return}
  case 'delmeal':S.meals=S.meals.filter(m=>m.id!==v);break;
  case 'water':S.water=Math.max(0,S.water+(+v));break;
  case 'sl':S.sleep=Math.max(0,Math.min(14,(S.sleep||7)+(+v)));break;
  case 'savesl':sheet=null;save();render();toast('حُفظ النوم');return;
  case 'flt':S.flt=v;break;
  case 'rpw':S.rpw=+v;break;
  case 'exp':toast('عرض فقط: التصدير يعمل في التطبيق الحالي');return;
  case 'wexp':toast('عرض فقط: تصدير الوزن يعمل في التطبيق الحالي');return;
  case 'rpe':{const s=curS();if(s&&rest){s.exs[rest.e].sets[rest.j].rpe=+v;save();render()}return}
  case 'visit':S.visits.push(Date.now());break;
  case 'seed':seed();toast('أُضيفت بيانات تجريبية');break;
  case 'reset':S=NEW();rest=null;sheet=null;break;
 }
 save();render();
}
function seed(){
 const now=Date.now();
 S.goal=S.goal||'lose';S.planId=S.planId||'fb3';
 if(!S.weights.length)for(let i=13;i>=0;i--)S.weights.push({ts:now-i*DAY,kg:Math.round((78-(13-i)*0.18)*10)/10});
 if(!S.sessions.some(s=>s.status==='complete')){
  const l=dayList();
  [6,4,2].forEach((d,i)=>{const t=l[i%l.length];S.sessions.push({id:'seed'+i,t:t.t,ts:now-d*DAY,status:'complete',ei:0,exs:t.ex.map(e=>({n:e.n,m:e.m,u:e.u,sets:Array.from({length:e.s},()=>({r:e.r,w:e.w||0,done:true}))}))})});
 }
 if(!todayMeals().length){const f=FOODS;[[0,'فطور'],[8,'فطور'],[1,'غداء'],[2,'غداء']].forEach((x,i)=>{const q=f[x[0]];S.meals.push({id:'seedm'+i,ts:now-i*1000,n:q[0],type:x[1],kcal:q[2],p:q[3],c:q[4],f:q[5]})})}
 S.water=S.water||1250;S.sleep=S.sleep||7;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled||b.dataset.a==='noop')return;act(b.dataset.a,b.dataset.v)});
render();

</script>
