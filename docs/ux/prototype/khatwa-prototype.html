<title>نموذج خُطوة</title>

<style>

:root{

}

 --btn:#f4f4f5; --btn-ink:#0a0a0b; --c-burn:#fb923c; --c-done:#4ade80; --c-rest:#60a5fa; --c-prog:#a78bfa; --c-warn:#fbbf24; color-scheme:dark}}
:root[data-theme="dark"]{

 --btn:#f4f4f5; --btn-ink:#0a0a0b; --c-burn:#fb923c; --c-done:#4ade80; --c-rest:#60a5fa; --c-prog:#a78bfa; --c-warn:#fbbf24; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;padding-inline:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.num{font-variant-numeric:tabular-nums;font-family:var(--font-d)}

.scr{padding:18px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:8px;margin-bottom:18px;min-height:44px}

.sm{font-size:14px}
.xs{font-size:12.5px}

.opt{display:flex;align-items:center;gap:14px;text-align:start;width:100%;padding:16px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);min-height:76px}

.grp{margin-bottom:22px}
.grp>h2{margin-bottom:10px;font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:600;padding:6px 8px;line-height:1.3}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:grid;justify-items:center;gap:4px;padding:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:12px;min-width:0}

.exl{display:grid;gap:0}

.nav>div{width:100%;max-width:460px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-inline:max(4px,env(safe-area-inset-right,0px)) max(4px,env(safe-area-inset-left,0px))}

.nav button.on{color:var(--ink);font-weight:700}

.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.hero .stat>div{background:color-mix(in srgb,var(--btn-ink) 12%,transparent);border-color:transparent}

.bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden}

.ex-h{display:grid;gap:4px;margin-bottom:14px}

.sets{display:grid;gap:8px}
.sr{border:1.5px solid var(--line);background:var(--card);border-radius:18px;overflow:hidden}
.sr.act{border-color:var(--ink)}
.sr .h{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;min-height:54px;text-align:start}

.sr .h .t{flex:1;min-width:0;font-weight:600}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:13px;color:var(--mu)}
.stp{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;direction:ltr;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}

.stp input{width:100%;min-width:0;text-align:center;border:0;background:transparent;font-family:var(--font-d);font-size:22px;font-weight:700;padding:0;font-variant-numeric:tabular-nums}
.stp input:focus{outline:2px solid var(--ink);outline-offset:-2px}
.rest{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;justify-content:center;padding-inline:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.rest>div{pointer-events:auto;width:100%;max-width:428px;background:var(--card);border:1.5px solid var(--c-rest);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.rest .tm{font-family:var(--font-d);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--c-rest)}
.rest .tx{flex:1;font-weight:600;min-width:0}
.toast{position:fixed;inset-inline:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;justify-content:center;padding-inline:16px;pointer-events:none}
.toast>div{pointer-events:auto;background:var(--btn);color:var(--btn-ink);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:14px;font-size:14.5px;max-width:420px}
.toast button{font-weight:700;text-decoration:underline;min-height:36px;padding-inline:4px}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;background:var(--card);border-radius:26px 26px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;max-height:88vh;overflow:auto}
.sheet h2{font-size:21px}
.sheet ul{margin:0;padding-inline-start:20px;color:var(--mu)}
.row{display:flex;align-items:center;gap:12px}
.lnk{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:13px 0;min-height:56px;border-top:1px solid var(--line)}
.lnk:first-child{border-top:0}
.lnk .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);flex:none}
.lnk .ico svg{width:22px;height:22px}
.lnk .t{flex:1;min-width:0}
.lnk .t b{display:block;font-weight:600}
.lnk .t span{color:var(--mu);font-size:13.5px}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.empty{text-align:center;padding:34px 12px;display:grid;gap:12px;justify-items:center}
.empty .ico{width:72px;height:72px;border-radius:24px;background:var(--soft);display:grid;place-items:center}
.empty .ico svg{width:36px;height:36px}
.sec{margin-top:22px;display:grid;gap:10px}
.sec>.row{justify-content:space-between}
.chev{width:18px;height:18px;color:var(--mu);transform:scaleX(-1)}
.pr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 const c=wk(),e=c.exs[c.i],last=c.i===c.exs.length-1,allDone=setsDone(e)===e.sets.length;
 const act=Math.min(c.act,e.sets.length-1);
 return `<div class="scr" style="padding-bottom:210px"><div class="top"><button class="ib" aria-label="إنهاء التمرين" data-a="endask">${IC.x()}</button><div style="flex:1;min-width:0"><div class="row" style="justify-content:space-between"><span class="sm mu">تمرين ${c.i+1} من ${c.exs.length}</span><span class="sm num mu" id="clk">${mmss((Date.now()-c.start)/1000)}</span></div><div class="bar" style="margin-top:6px"><i style="width:${totalDone()/totalSets()*100}%"></i></div></div></div>
 <div class="ex-h"><h1 style="font-size:26px">${e.n}</h1><span class="mus"><span style="color:var(--c-burn);display:inline-grid;width:18px">${IC.dumb()}</span>${e.m}</span>${e.sug?'<span class="xs mu">الأوزان اقتراح للبداية. غيّرها كما تناسبك.</span>':''}</div>
 <div class="sets">${e.sets.map((s,i)=>{const isA=i===act;const lastv=null;
  const head=`<button class="h" data-a="actset" data-v="${i}" aria-expanded="${isA}"><span class="k">${s.done?IC.check():i+1}</span><span class="t">المجموعة ${i+1}${s.done?`<small>${s.w!=null?fmt(s.w)+' كغ × ':''}${s.r}${e.u&&s.w==null?' '+e.u:''} · محفوظة</small>`:`<small>الهدف ${PLANDAY(e.n)} ${e.u||'تكرار'}</small>`}</span>${s.done?`<span class="tag" style="color:var(--c-done);border-color:var(--c-done)">تمت</span>`:''}</button>`;
  const body=isA?`<div class="body"><div class="pair">${s.w!=null?`<div class="fld"><span>الوزن (كغ)</span><div class="stp"><button data-a="adj" data-f="w" data-d="-2.5" aria-label="أنقص الوزن">−</button><input inputmode="decimal" id="w${i}" value="${fmt(s.w)}" data-f="w" aria-label="الوزن بالكيلوغرام"><button data-a="adj" data-f="w" data-d="2.5" aria-label="زد الوزن">+</button></div></div>`:`<div class="fld"><span>الوزن</span><div class="stp" style="opacity:.55"><button disabled>−</button><input value="وزن الجسم" disabled style="font-size:15px"><button disabled>+</button></div></div>`}
   <div class="fld"><span>${e.u?'الثواني':'التكرار'}</span><div class="stp"><button data-a="adj" data-f="r" data-d="-1" aria-label="أنقص التكرار">−</button><input inputmode="numeric" id="r${i}" value="${s.r}" data-f="r" aria-label="التكرار"><button data-a="adj" data-f="r" data-d="1" aria-label="زد التكرار">+</button></div></div></div>
   ${s.done?`<button class="btn ghost sm" data-a="undoset" data-v="${i}">${IC.undo()} ألغِ تسجيل هذه المجموعة</button>`:`<button class="btn" data-a="doneset">${IC.check()} تمت المجموعة</button>`}</div>`:'';
  return `<div class="sr ${isA?'act':''} ${s.done?'done':''}">${head}${body}</div>`}).join('')}
  <button class="btn ghost sm" data-a="addset" style="margin-top:2px">${IC.plus()} أضف مجموعة</button></div>
 <div class="fix"><div class="row" style="gap:10px">${c.i>0?`<button class="btn ghost" style="width:auto;min-width:96px" data-a="prevex">السابق</button>`:''}<button class="btn" data-a="${last?'finishask':'nextex'}">${last?'إنهاء التمرين':(allDone?'التمرين التالي':'تخطّ إلى التالي')} ${last?IC.check():IC.back()}</button></div></div></div>`}
function PLANDAY(n){const d=today();const e=d&&d.ex.find(x=>x.n===n);return e?e.r:''}
function curSet(){const c=wk(),e=c.exs[c.i];return e.sets[Math.min(c.act,e.sets.length-1)]}
function readFields(){const c=wk();if(!c)return;const e=c.exs[c.i],i=Math.min(c.act,e.sets.length-1),s=e.sets[i];
 const w=$('#w'+i),r=$('#r'+i);if(w&&s.w!=null){const v=parseFloat(String(w.value).replace(',','.'));if(!isNaN(v)&&v>=0)s.w=v}if(r){const v=parseInt(r.value,10);if(!isNaN(v)&&v>=0)s.r=v}}
function startRest(sec){rest={end:Date.now()+sec*1000,total:sec};drawRest();clearInterval(restT);restT=setInterval(tick,500)}
function tick(){const c=$('#clk');if(c&&S.cur)c.textContent=mmss((Date.now()-S.cur.start)/1000);
 if(rest){const left=(rest.end-Date.now())/1000;const t=$('#rt');if(left<=0){stopRest()}else if(t)t.textContent=mmss(left)}}
function stopRest(){rest=null;lastMsg=null;clearInterval(restT);restT=setInterval(tick,1000);drawRest()}
let lastMsg=null;
function drawRest(){let el=$('#restbar');if(!rest||S.screen!=='workout'){if(el)el.remove();return}
 if(!el){el=document.createElement('div');el.id='restbar';el.className='rest';document.body.appendChild(el)}
 el.innerHTML=`<div style="display:grid;gap:6px;padding:10px 10px 10px 12px">${lastMsg?`<div class="row" style="justify-content:space-between;font-size:14px"><span><span style="color:var(--c-done)">✓</span> ${lastMsg.text}</span><button data-a="toastundo" style="font-weight:700;text-decoration:underline;min-height:32px;padding-inline:6px">تراجع</button></div>`:''}<div class="row" role="timer"><span style="color:var(--c-rest);display:grid;width:24px">${IC.clock()}</span><span class="tx">راحة</span><span class="tm" id="rt">${mmss((rest.end-Date.now())/1000)}</span><button class="btn sm" style="width:auto;min-width:104px" data-a="skiprest">تخطَّ الراحة</button></div></div>`}
function toast(msg,undoLabel,undoFn){let el=$('#toast');if(el)el.remove();el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');
 el.innerHTML=`<div><span>${msg}</span>${undoLabel?`<button data-a="toastundo">${undoLabel}</button>`:''}</div>`;document.body.appendChild(el);window._tu=undoFn||null;clearTimeout(toastT);toastT=setTimeout(()=>{const t=$('#toast');if(t)t.remove()},4500)}
function summarize(){const c=wk();let vol=0;const exs=c.exs.map(e=>({n:e.n,u:e.u,sets:e.sets.map(s=>({w:s.w,r:s.r,done:s.done}))}));exs.forEach(e=>e.sets.forEach(s=>{if(s.done&&s.w)vol+=s.w*s.r}));
 return{t:c.t,kind:'plan',date:new Date().toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'}),dur:(Date.now()-c.start)/1000,exs,vol}}
function saveSession(){const s=summarize();if(!s.exs.some(e=>e.sets.some(x=>x.done))){S.cur=null;stopRest();return false}S.sessions.push(s);S.cur=null;stopRest();return true}
function vSummary(){
 const s=lastSess(),n=s.exs.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0),all=s.exs.reduce((a,e)=>a+e.sets.length,0);
 return `<div class="scr"><div class="empty" style="padding-top:36px"><span class="ico" style="color:var(--c-done);background:color-mix(in srgb,var(--c-done) 14%,var(--soft))">${IC.check()}</span><h1>أنهيت التمرين</h1><div class="mu">حُفظ على جوالك. ${n} من ${all} مجموعة.</div></div>
 <div class="stat" style="margin-top:6px"><div><b>${n}</b><span>مجموعة</span></div><div><b>${mmss(s.dur)}</b><span>المدة</span></div><div><b>${fmt(s.vol)}</b><span>كغ حجم</span></div></div>
 <div class="card" style="margin-top:14px"><b>ما سجّلته</b>${s.exs.map(e=>{const d=e.sets.filter(x=>x.done);return `<div class="pr"><span>${e.n}</span><span class="num mu">${d.length?d.length+' × '+(d[0].w!=null&&d[0].w>0?fmt(d[0].w)+' كغ':d[0].r+(e.u||'')):'—'}</span></div>`}).join('')}</div>
 <div class="fix"><div class="stack" style="gap:8px"><button class="btn" data-a="toprogress">${IC.chart()} شوف تقدّمك</button><button class="btn ghost sm" data-a="home">العودة إلى اليوم</button></div></div></div>`}

/* ===== النوافذ ===== */
function openSheet(h){sheet=h;drawSheet()}
function closeSheet(){sheet=null;drawSheet()}
function drawSheet(){let el=$('#sheet');if(!sheet){if(el)el.remove();return}if(!el){el=document.createElement('div');el.id='sheet';document.body.appendChild(el)}
 el.innerHTML=`<div class="sheet-bg" data-a="sheetbg"><div class="sheet" role="dialog" aria-modal="true">${sheet}</div></div>`}

/* ===== الرسم ===== */
function navBar(){const t=[['today','اليوم','today'],['plan','الخطة','plan'],['food','التغذية','food'],['progress','التقدّم','chart'],['more','المزيد','grid']];
 return `<nav class="nav" aria-label="التنقل الرئيسي"><div>${t.map(([k,l,ic])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}" ${S.tab===k?'aria-current="page"':''}>${IC[ic]()}<span>${l}</span></button>`).join('')}</div></nav>`}
function draw(){
 const root=$('#app');let h='';
 const sc=S.screen;
 if(sc==='welcome')h=vWelcome();else if(sc==='setup')h=vSetup();else if(sc==='plans')h=vPlans();
 else if(sc==='workout')h=vWorkout();else if(sc==='summary')h=vSummary();else if(sc==='detail')h=vDetail();
 else if(sc==='home'){h=({today:vToday,plan:vPlanTab,food:vFood,progress:vProgressTab,more:vMore})[S.tab]();h+=navBar()}
 root.innerHTML=hint()+h;
 drawRest();
 if(S.screen!=='workout'){const tt=$('#toast');if(tt)tt.remove()}
 clearInterval(restT);restT=setInterval(tick,1000);
}
function stepSet(f,d){readFields();const s=curSet();if(f==='w'&&s.w!=null)s.w=Math.max(0,Math.round((s.w+d)*10)/10);if(f==='r')s.r=Math.max(0,s.r+d);save();const c=wk(),i=Math.min(c.act,c.exs[c.i].sets.length-1);const wi=$('#w'+i),ri=$('#r'+i);if(wi&&s.w!=null)wi.value=fmt(s.w);if(ri)ri.value=s.r}

document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='sheetbg'&&ev.target!==b)return;
 switch(a){
  case 'hint':S.hint=false;save();draw();break;
  case 'goal':S.goal=v;S.screen='setup';save();draw();window.scrollTo(0,0);break;
  case 'set':S[b.dataset.k]=b.dataset.k==='days'?+v:v;S.planId=null;save();draw();break;
  case 'back':{const m={setup:'welcome',plans:'setup'};go(m[S.screen]||'welcome');break}
  case 'toplans':S.planId=null;go('plans');break;
  case 'pick':S.planId=v;save();draw();break;
  case 'startplan':S.tab='today';go('home');break;
  case 'tab':S.screen='home';S.tab=v;save();draw();window.scrollTo(0,0);break;
  case 'changeplan':S.planId=null;go('setup');break;
  case 'startwk':startWorkout();break;
  case 'actset':readFields();S.cur.act=+v;save();draw();break;
  case 'adj':stepSet(b.dataset.f,+b.dataset.d);break;
  case 'doneset':{readFields();const c=wk(),e=c.exs[c.i],i=Math.min(c.act,e.sets.length-1),s=e.sets[i];s.done=true;
   const nx=e.sets.findIndex(x=>!x.done);c.act=nx<0?i:nx;save();draw();
   const lbl=`المجموعة ${i+1} محفوظة${s.w!=null?': '+fmt(s.w)+' كغ × '+s.r:': '+s.r+(e.u?' '+e.u:' تكرار')}`;
   const undo=()=>{s.done=false;c.act=i;lastMsg=null;save();stopRest();draw()};
   window._tu=undo;
   if(nx>=0){lastMsg={text:lbl};startRest(60)}else{lastMsg=null;stopRest();toast(lbl,'تراجع',undo)}break}
  case 'undoset':{const c=wk(),e=c.exs[c.i];e.sets[+v].done=false;c.act=+v;save();draw();break}
  case 'toastundo':if(window._tu)window._tu();{const t=$('#toast');if(t)t.remove()}break;
  case 'skiprest':stopRest();break;
  case 'addset':{readFields();const c=wk(),e=c.exs[c.i],l=e.sets[e.sets.length-1];e.sets.push({w:l.w,r:l.r,done:false});c.act=e.sets.length-1;save();draw();break}
  case 'nextex':{readFields();const c=wk();c.i++;c.act=Math.max(0,c.exs[c.i].sets.findIndex(x=>!x.done));if(c.act<0)c.act=0;stopRest();save();draw();window.scrollTo(0,0);break}
  case 'prevex':{readFields();const c=wk();c.i--;c.act=Math.max(0,c.exs[c.i].sets.findIndex(x=>!x.done));stopRest();save();draw();window.scrollTo(0,0);break}
  case 'endask':case 'finishask':{readFields();const n=totalDone(),all=totalSets();
   if(n===0){openSheet(`<h2>إنهاء بلا تسجيل؟</h2><div class="mu">لم تسجّل أي مجموعة بعد، فلن يُحفظ شيء.</div><button class="btn" data-a="discard">اخرج</button><button class="btn ghost" data-a="closesheet">أكمل التمرين</button>`)}
   else openSheet(`<h2>${a==='finishask'&&n===all?'أنهيت كل المجموعات':'إنهاء التمرين الآن؟'}</h2><div class="mu">سجّلت ${n} من ${all} مجموعة. الذي سجّلته يُحفظ، وما لم تسجّله لا يُحتسب.</div><button class="btn" data-a="finish">${IC.check()} احفظ وأنهِ التمرين</button><button class="btn ghost" data-a="closesheet">أكمل التمرين</button><button class="btn ghost sm" data-a="discard" style="color:#dc2626">تجاهل هذه الجلسة بالكامل</button>`);break}
  case 'closesheet':closeSheet();break;
  case 'sheetbg':closeSheet();break;
  case 'finish':closeSheet();if(saveSession())go('summary');else go('home');break;
  case 'discard':closeSheet();S.cur=null;stopRest();go('home');break;
  case 'toprogress':S.screen='home';S.tab='progress';save();draw();window.scrollTo(0,0);break;
  case 'home':S.screen='home';S.tab='today';save();draw();window.scrollTo(0,0);break;
  case 'detail':S.detail=+v;go('detail');break;
  case 'svc':{const [n,d,tg,why]=v.split('|');
   if(n==='المدرب الذكي')openSheet(`<h2>قبل استخدام المدرب الذكي</h2><div class="mu">عند السؤال نرسل إلى خدمة الذكاء الاصطناعي ما يلزم للإجابة فقط:</div><ul><li>الجنس والعمر والطول والوزن</li><li>هدفك ومستواك وأوزان آخر تمارينك</li><li>متوسط أكلك ونومك آخر أسبوع</li></ul><div class="mu sm">لا نرسل اسمك ولا بريدك. تقدر تسحب موافقتك من «بياناتي والخصوصية» متى شئت. الإجابات ليست تشخيصًا طبيًا.</div><button class="btn" data-a="closesheet">أوافق وأتابع</button><button class="btn ghost" data-a="closesheet">ليس الآن</button>`);
   else openSheet(`<h2>${n}</h2><div class="mu">${d}</div><div class="row"><span class="tag">قرار النسخة الأولى: ${tg}</span></div><div class="mu sm">${why}</div><button class="btn" data-a="closesheet">حسنًا</button>`);break}
  case 'resetdemo':openSheet(`<h2>تبدأ من جديد؟</h2><div class="mu">يُمسح ما سجّلته في هذا النموذج على هذا الجوال، وتعود إلى أول شاشة.</div><button class="btn" data-a="doreset">ابدأ من جديد</button><button class="btn ghost" data-a="closesheet">إلغاء</button>`);break;
  case 'doreset':closeSheet();try{localStorage.removeItem(KEY)}catch(e){}S={screen:'welcome',tab:'today',goal:null,place:'gym',days:3,level:'b',planId:null,sessions:[],cur:null,hint:true,detail:null};stopRest();draw();window.scrollTo(0,0);break;
 }
});
/* حقول الإدخال: احفظ القيمة المكتوبة */
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset&&t.dataset.f&&S.cur){readFields();save()}});
document.addEventListener('focusin',ev=>{const t=ev.target;if(t.tagName==='INPUT'&&!t.disabled)t.select&&t.select()});
draw();
</script>
