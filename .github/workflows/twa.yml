name: Build TWA (Bubblewrap)
on:
  workflow_dispatch:
    inputs:
      host:
        description: "نطاق موقعك بدون https"
        default: "khatwa-fitness-app.netlify.app"
        required: true
      version_code:
        description: "رقم الإصدار (يزيد مع كل رفع للمتجر)"
        default: "1"
permissions:
  contents: write
jobs:
  twa:
    runs-on: ubuntu-latest
    env:
      HAS_KS: ${{ secrets.KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Bubblewrap
        run: |
          npm i -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.0" "platforms;android-35" >/dev/null
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
          [ -e "$ANDROID_HOME/tools" ] || sudo ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          ls "$ANDROID_HOME/tools/bin" | head -3
      - name: Prepare project
        run: |
          mkdir build && cd build
          python3 ../twa/make_manifest.py "${{ inputs.host }}" "${{ inputs.version_code }}"
          if [ "$HAS_KS" = "true" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android.keystore
            echo "KS_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            sed -i "s/\"alias\": \"khatwa\"/\"alias\": \"${{ secrets.KEY_ALIAS }}\"/" twa-manifest.json
          else
            keytool -genkeypair -v -keystore android.keystore -alias khatwa -keyalg RSA -keysize 2048 -validity 10000 -storepass testpass123 -keypass testpass123 -dname "CN=Khatwa Test"
            echo "KS_PASS=testpass123" >> $GITHUB_ENV
          fi
      - name: Build
        working-directory: build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KS_PASS }}
        run: |
          yes y | bubblewrap update --skipVersionUpgrade
          yes y | bubblewrap build --skipPwaValidation
          keytool -list -v -keystore android.keystore -storepass "$KS_PASS" | grep "SHA256:" | head -1 | tee fingerprint.txt
      - name: Publish test APK to a release
        if: env.HAS_KS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app-release-signed.apk khatwa-twa-test.apk
          gh release view twa-test >/dev/null 2>&1 || gh release create twa-test --title "TWA test" --notes "APK تجريبي بمفتاح مؤقت"
          gh release upload twa-test khatwa-twa-test.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: khatwa-twa-test
          path: |
            build/app-release-signed.apk
            build/fingerprint.txt
