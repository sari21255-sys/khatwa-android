name: Tests
on:
  pull_request:
  push:
    branches: [main, master, 'p0/**', 'p1/**']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Generated files match the committed ones (index, _headers, CSP hashes)
        run: python3 tools/build.py --check
      - run: npm ci
      - name: Worker tests
        run: node tests/worker.test.mjs
      - name: App tests (Playwright)
        run: |
          npm i -g playwright
          npx playwright install --with-deps chromium
          NODE_PATH="$(npm root -g)" node tests/app.e2e.js
      - name: P0 acceptance (security headers + CSP, offline eq-db, 320px, worker failure)
        run: NODE_PATH="$(npm root -g)" node docs/technical-audit/evidence/p0-acceptance.mjs
      - name: Supabase schema + RLS tests
        env: { PGPASSWORD: pg }
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/00_mock_supabase.sql
          psql -h localhost -U postgres -q -f supabase/tests/01_rls_and_limits.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/02_p1_sync.sql
      - name: P1 concurrency (parallel psql sessions) and sync end-to-end (two browsers, real Postgres functions)
        env: { PGPASSWORD: pg }
        run: |
          PSQL="psql -h localhost -U postgres -d postgres -q -At" bash supabase/tests/03_concurrency.sh
          node tests/worker.p1.test.mjs
          PSQL="psql -h localhost -U postgres -d postgres -q -At" NODE_PATH="$(npm root -g)" node tests/sync.e2e.mjs
