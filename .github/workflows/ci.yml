name: Tests
on:
  pull_request:
  push:
    branches: [main, master, 'p0/**', 'p1/**', 'ux/**']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Generated files match the committed ones (index, _headers, CSP hashes)
        run: python3 tools/build.py --check
      - name: gen-headers emits LF even when text-mode writes translate to CRLF (Windows simulation)
        run: python3 tests/crlf-sim.py tools/gen-headers.py
      - run: npm ci
      - name: Worker tests
        run: node tests/worker.test.mjs
      - name: App tests (Playwright)
        run: |
          npm i -g playwright
          npx playwright install --with-deps chromium
          NODE_PATH="$(npm root -g)" node tests/app.e2e.js
      - name: UX acceptance (today/train/archive, makeup sessions, local Cairo font)
        run: |
          NODE_PATH="$(npm root -g)" node tests/ux.e2e.js
          NODE_PATH="$(npm root -g)" node tests/ux2.e2e.js
          NODE_PATH="$(npm root -g)" node tests/sxmerge.e2e.js
          NODE_PATH="$(npm root -g)" node tests/font.e2e.js
          NODE_PATH="$(npm root -g)" node tests/consent.e2e.js
          NODE_PATH="$(npm root -g)" node tests/nav.e2e.js
      - name: P0 acceptance (security headers + CSP, offline eq-db, 320px, worker failure)
        run: NODE_PATH="$(npm root -g)" node docs/technical-audit/evidence/p0-acceptance.mjs
      - name: Supabase schema + RLS tests
        env: { PGPASSWORD: pg }
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/00_mock_supabase.sql
          psql -h localhost -U postgres -q -f supabase/tests/01_rls_and_limits.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/02_p1_sync.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/04_rollback.sql
          # الاختبار نفسه على قاعدة بترتيب لغوي ICU (en-US) كما في Supabase، حيث 'a' < 'B': يثبت أن مقارنة dev بالبايتات لا تتبع ترتيب القاعدة
          psql -h localhost -U postgres -q -c "create database t_icu template template0 encoding 'UTF8' locale_provider icu icu_locale 'en-US' locale 'C.UTF-8'"
          psql -h localhost -U postgres -d t_icu -v ON_ERROR_STOP=1 -q -f supabase/tests/00_mock_supabase.sql
          psql -h localhost -U postgres -d t_icu -v ON_ERROR_STOP=1 -q -f supabase/tests/02_p1_sync.sql
          psql -h localhost -U postgres -d t_icu -v ON_ERROR_STOP=1 -q -f supabase/tests/04_rollback.sql
      - name: P1 concurrency (parallel psql sessions) and sync end-to-end (two browsers, real Postgres functions)
        env: { PGPASSWORD: pg }
        run: |
          PSQL="psql -h localhost -U postgres -d postgres -q -At" bash supabase/tests/03_concurrency.sh
          node tests/worker.p1.test.mjs
          PSQL="psql -h localhost -U postgres -d postgres -q -At" NODE_PATH="$(npm root -g)" node tests/sync.e2e.mjs
          PSQL="psql -h localhost -U postgres -d postgres -q -At" NODE_PATH="$(npm root -g)" node tests/sync-sx.e2e.mjs
  build-reproducible:
    name: build --check (${{ matrix.os }}) from a clean clone, no manual file setup
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Generated files match the committed ones
        run: python tools/build.py --check
      - name: Diagnostics on failure (annotations only)
        if: failure()
        shell: python
        run: |
          import subprocess,sys,tempfile,os,hashlib
          for f in ['app/fitness-tracker.html','app/head.html','www/index.html','pwa/index.html','pwa/_headers','tools/build.sha256']:
              b=open(f,'rb').read()
              print('::error::'+f+' bytes='+str(len(b))+' CR='+str(b.count(b'\r'))+' sha='+hashlib.sha256(b).hexdigest()[:16])
          r=subprocess.run([sys.executable,'tools/build.py','--check'],capture_output=True)
          print('::error::rc='+str(r.returncode)+' out='+r.stdout.decode('utf-8','replace').replace('\n',' | ')[:500]+' err='+r.stderr.decode('utf-8','replace').replace('\n',' | ')[-500:])
      - name: No CR in generated files, and SHA-256 equals tools/build.sha256 (same bytes on every OS)
        shell: python
        run: |
          import hashlib,sys
          bad=0
          for line in open('tools/build.sha256',encoding='utf-8'):
              h,f=line.split()
              b=open(f,'rb').read()
              binary=f.startswith('pwa/fonts/') and not f.endswith('.txt')   # الخطوط ثنائية: قد تحوي 0x0d، ويكفي تطابق SHA-256
              ok=(binary or b'\r' not in b) and hashlib.sha256(b).hexdigest()==h
              print('OK  ' if ok else 'FAIL', f, hashlib.sha256(b).hexdigest(), 'binary' if binary else ('CR' if b'\r' in b else 'LF'))
              bad+=0 if ok else 1
          sys.exit(1 if bad else 0)
