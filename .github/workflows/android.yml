name: Build Android
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'p0/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KS: ${{ secrets.KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install
        run: |
          npm install
          pip install pillow
      - name: Generate Android project
        run: |
          npx cap add android
          python3 scripts/patch_android.py
          npx cap sync android
      - name: Inspect plugin sources (diagnostic)
        run: |
          { echo "== health manifest"; grep -rniE "uses-permission|queries" node_modules/@capgo/capacitor-health/android/src/main/AndroidManifest.xml || true
            echo "== health calories mapping"; grep -rniE "calories" node_modules/@capgo/capacitor-health/android/src/main/java | head -12 || true
            echo "== health plugin version/types"; grep -m1 '"version"' node_modules/@capgo/capacitor-health/package.json; grep -nE "^\s+[A-Z_]+\(" node_modules/@capgo/capacitor-health/android/src/main/java/app/capgo/plugin/health/HealthDataType.kt | head -14
            echo "== local-notifications manifest"; grep -rn "uses-permission" node_modules/@capacitor/local-notifications/android/src/main/AndroidManifest.xml || true; } > diag.txt
          echo "::notice title=plugin-diag::$(tr '\n' '|' < diag.txt | cut -c1-3500)"
      - name: Build debug APK (installable directly)
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build release APK (unsigned) and verify manifest
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease
          cd ..
          python3 scripts/check_manifest.py android/app/build/outputs/apk/release/app-release-unsigned.apk --release 2>&1 | tee manifest-release.txt
          python3 scripts/check_manifest.py android/app/build/outputs/apk/debug/app-debug.apk --debug 2>&1 | tee manifest-debug.txt
      - name: Report manifest results
        if: always()
        shell: bash
        run: |
          for f in manifest-release manifest-debug; do
            [ -f $f.txt ] && echo "::notice title=$f::$(tr '\n' '|' < $f.txt | cut -c1-3500)" || echo "::warning title=$f::no output file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-reports
          path: |
            manifest-release.txt
            manifest-debug.txt
      - uses: actions/upload-artifact@v4
        with:
          name: khatwa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a downloadable release link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk khatwa.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "خطوة — آخر نسخة" --notes "حمّل khatwa.apk وثبّته على هاتفك" --latest
          gh release upload latest khatwa.apk --clobber
      - name: Build signed release AAB (for Google Play)
        if: env.HAS_KS == 'true'
        working-directory: android
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KS == 'true'
        with:
          name: khatwa-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
