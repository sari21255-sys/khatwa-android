name: Generate lockfile
# يُشغَّل عند تغيير package.json (لا يوجد وصول لسجل npm من بيئة التطوير) لتوليد package-lock.json ودفعه إلى الفرع نفسه.
on:
  push:
    branches: ['p0/**','p1/**']
    paths: ['package.json','.github/workflows/lockfile.yml']
permissions: { contents: write }
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && echo "no change" || { git commit -m "chore: add package-lock.json (generated in CI)"; git push; }
